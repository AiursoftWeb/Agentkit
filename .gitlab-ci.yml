stages: [build, test, package]
variables: { NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages" }
build:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:10.0
  script: ["dotnet build Aiursoft.AgentKit.sln --configuration Release"]
test:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0
  script: ["dotnet test tests/Aiursoft.AgentKit.Tests/Aiursoft.AgentKit.Tests.csproj --configuration Release --logger:junit;LogFilePath=test-results.xml --collect:XPlat Code Coverage"]
package:
  stage: package
  image: mcr.microsoft.com/dotnet/sdk:10.0
  script: ["dotnet pack src/Aiursoft.AgentKit/Aiursoft.AgentKit.csproj --configuration Release --output artifacts/packages --no-build", "unzip -l artifacts/packages/*.nupkg"]
